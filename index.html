<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AXA XL ESS Claims Continuous Improvement organisation chart" />
    <title>ESS Claims — Continuous Improvement | AXA XL</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="./css/styles.css?v=20261029f" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-label">
          <span class="topbar-kicker">AXA XL · TRAF</span>
          <span class="topbar-hint">16:9 PowerPoint slide · real roster</span>
        </div>
        <div class="actions">
          <div class="mode-group" role="group" aria-label="Display mode">
            <button type="button" class="btn" data-mode="light" title="Light mode">
              <span class="label">Light</span>
            </button>
            <button type="button" class="btn" data-mode="color" title="Color mode with pillar gradients">
              <span class="label">Color</span>
            </button>
            <button type="button" class="btn" data-mode="dark" title="Dark mode (black)">
              <span class="label">Dark</span>
            </button>
          </div>
          <button type="button" class="btn" id="copy-btn" title="Copy full slide as image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" />
              <path d="M5 15V5a2 2 0 0 1 2-2h10" />
            </svg>
            <span class="label">Copy</span>
          </button>
          <button type="button" class="btn btn-primary" id="download-btn" title="Download full slide as PNG (1920×1080)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 4v10" />
              <path d="M8 10l4 4 4-4" />
              <path d="M5 18h14" />
            </svg>
            <span class="label">Download</span>
          </button>
        </div>
      </header>

      <main class="stage">
        <div class="slide-shell">
          <div
            class="ppt-slide"
            id="ppt-slide"
            aria-label="Organisation chart PowerPoint slide, 16 by 9"
          >
            <div class="slide-header">
              <div class="slide-header-left">
                <div class="slide-mark" aria-hidden="true"></div>
                <div class="slide-titles">
                  <h1 id="chart-title">Continuous Improvement Initiatives</h1>
                  <p id="chart-subtitle">ESS Claims Organization Chart</p>
                </div>
              </div>
              <img
                src="./assets/axa-xl-logo.png"
                alt="AXA XL"
                width="610"
                height="156"
                class="slide-logo"
              />
            </div>
            <div class="chart-viewport" id="chart-viewport">
              <div class="chart-scaler" id="chart-scaler">
                <div id="org-root"></div>
              </div>
              <div class="status" id="status">Loading organisation chart…</div>
            </div>
            <div class="slide-footer">
              <span id="slide-footer-note">Job Rotation — Meghana Gowda</span>
              <span>AXA XL · ESS Claims</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="./js/app.js?v=20261029f"></script>
  </body>
</html>
